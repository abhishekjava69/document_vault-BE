services:
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8082:8080"
    volumes:
      - ./keystore.p12:/app/keystore.p12:ro
    environment:
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/app/keystore.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: springboot
      SERVER_SSL_KEY_STORE_PASSWORD: Hubli@8123
    depends_on:
      - auth-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//database-1.cxm0i4s68914.eu-north-1.rds.amazonaws.com:1521/ORCL
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: HUBLI8123
    restart: unless-stopped
